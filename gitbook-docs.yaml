# yaml-language-server: $schema=https://api.gitbook.com/gitbook-docs.yaml
$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1

# Navigation for this site is defined by ./SUMMARY.md, not by this file.
# The single space below syncs the whole repository, so GitBook builds the
# sidebar from SUMMARY.md's groups and uses ./README.md as the landing page.
site:
  title: MansaFi Docs
  structure:
    - type: space
      key: space-docs
      title: MansaFi Docs
      path: docs
      default: true
      content:
        directory: .
